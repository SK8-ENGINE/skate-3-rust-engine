[package]
name = "skate-game"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "skate3rust"
path = "src/main.rs"

[[bin]]
name = "skate3-multiplayer"
path = "src/multiplayer_main.rs"
test = false

[[bin]]
name = "skate3-custom-models"
path = "src/custom_models_main.rs"
test = false

[features]
default = ["dev-dynamic"]
dev-dynamic = ["bevy/dynamic_linking"]

[dependencies]
bevy = { workspace = true, features = ["jpeg", "trace", "debug", "bevy_audio", "wav"] }
skate-core.workspace = true
skate-data.workspace = true
half = "=2.7.1"
serde_json.workspace = true
serde.workspace = true
    skate-net = { path = "../skate-net" }
blake3 = "=1.8.7"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
skate-mods = { path = "../skate-mods" }
skate-dynamics = { path = "../skate-dynamics" }
gltf = { version = "=1.4.1", default-features = true }

# Desktop (non-Windows) pad transport. Matches the gilrs version Bevy 0.18.1
# itself uses (see Cargo.lock) so only one copy is compiled.
[target.'cfg(not(windows))'.dependencies]
gilrs = "=0.11.2"

[dev-dependencies]
naga = { version = "=27.0.3", features = ["wgsl-in", "msl-out"] }
naga_oil = { version = "=0.20.0", default-features = false }
# Headless shader probes pin Vulkan on Windows/Linux, Metal on macOS.
# Enable both backends so `cargo test` compiles the probe on either OS.
wgpu = { version = "=27.0.1", default-features = false, features = ["vulkan", "metal", "naga-ir"] }
