[package]
name = "skate-launcher"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The couch launcher on every OS (docs/hails-additions/44-every-os.md, spec 44a)."

[[bin]]
name = "skate-launcher"
path = "src/main.rs"

[dependencies]
jiff = { version = "=0.2.42", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
serde_json.workspace = true
