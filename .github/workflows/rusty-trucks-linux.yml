# Rusty Trucks Linux build for Hailey-Ross/rusty-trucks (docs/hails-additions/44-every-os.md): the game and its tests on
# Linux for every push to hails-additions, its releases and manual runs. Steps: rusty-trucks-unix-build.yml.
name: Rusty Trucks Linux build
on:
  push:
    branches: [hails-additions]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-build-linux-x64-${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'Hailey-Ross/rusty-trucks' && (github.event_name != 'release' || github.event.release.tag_name != 'experimental')
    uses: ./.github/workflows/rusty-trucks-unix-build.yml
    with:
      os: ubuntu-24.04
      target: linux-x64
      refpack: librefpack.so
